name: Documentation
on:
  push:
    paths: ["docs/**", "examples/**", ".readthedocs.yaml", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "examples/**", ".readthedocs.yaml", ".github/workflows/docs.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r docs/requirements.txt
      - run: python -m sphinx -b html -n -W --keep-going docs docs/_build/html
      - run: python -m compileall -q examples
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-html
          path: docs/_build/html
