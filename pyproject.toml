[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antstorch"
version = "0.2.0"
requires-python = ">=3.10"
description = "PyTorch-based ANTsX Utilities"
readme = "README.md"
authors = [{name = "Nick Tustison", email = "ntustison@gmail.com"},
           {name = "Brian Avants", email = "stnava@gmail.com"}]
license = {text = "Apache License 2.0"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "antspyx",
    "torch",
    "torchvision",
    "scikit-learn",
    "numpy",
    "scipy",
    "pandas",
    "requests",
    "statsmodels",
    "matplotlib",
    "jax",
    "optax",
    "jaxopt",
    "tqdm",
    "antsnormflows>=1.0.0",
    ]

[tool.setuptools.packages.find]
include = ["antstorch*"]

[project.optional-dependencies]
notebooks = ["nbformat>=5", "nbclient>=0.10", "ipykernel>=6"]
siam = ["nnunetv2>=2.8.1,<3", "nibabel>=5", "filelock>=3"]

[tool.setuptools.package-data]
# Bundles the 90-pair Mindboggle-101 definition antstorch.benchmark ships
# with, so it is present in installed (not just editable/checkout) installs.
antstorch = ["benchmark/pairs.csv"]

[project.urls]
"Homepage" = "https://github.com/ANTsX/ANTsTorch"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "tutorial_data: example notebook uses downloadable tutorial acquisitions without pretrained weights",
    "integration: exercises a complete pipeline or multiple components",
    "requires_data: needs external images, templates or pretrained weights (possibly cached)",
    "cuda: requires a CUDA accelerator",
    "mps: requires an Apple Metal accelerator",
    "slow: marks tests as slow (deselect with -m \"not slow\")",
]
filterwarnings = [
    # tqdm's own progress-bar formatting uses the Python-3.12-deprecated
    # datetime.utcfromtimestamp(); tracked upstream as fixed in
    # https://github.com/tqdm/tqdm/issues/1517, but still present in some
    # installed versions. Scoped to tqdm.std so it never masks a
    # DeprecationWarning raised by our own code.
    "ignore:datetime\\.datetime\\.utcfromtimestamp\\(\\) is deprecated:DeprecationWarning:tqdm\\.std",
    # NumPy 2.0.x + macOS Accelerate: spurious "divide by zero / overflow / invalid value encountered in matmul" on finite
    # inputs, raised inside syntx.greedy (read-only dependency, so it cannot be fixed there). Scoped to that module.
    "ignore:.*encountered in matmul:RuntimeWarning:syntx\\.greedy",
]
