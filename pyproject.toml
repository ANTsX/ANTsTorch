[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antstorch"
version = "0.0.1"
requires-python = ">=3.10"
description = "PyTorch-based ANTsX Utilities"
readme = "README.md"
authors = [{name = "Nick Tustison", email = "ntustison@gmail.com"},
           {name = "Brian Avants", email = "stnava@gmail.com"}]
license = {text = "Apache License 2.0"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "antspyx",
    "torch",
    "torchvision",
    "scikit-learn",
    "numpy",
    "scipy",
    "pandas",
    "requests",
    "statsmodels",
    "matplotlib",
    "jax",
    "optax",
    "jaxopt",
    "tqdm",
    "antsnormflows @ git+https://github.com/ANTsx/ANTsNormalizingFlows.git@main"
    ]

[tool.setuptools.packages.find]
include = ["antstorch*"]

[tool.setuptools.package-data]
# Bundles the 90-pair Mindboggle-101 definition antstorch.benchmark ships
# with, so it is present in installed (not just editable/checkout) installs.
antstorch = ["benchmark/pairs.csv"]

[project.urls]
"Homepage" = "https://github.com/ANTsX/ANTsTorch"

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (deselect with -m \"not slow\")",
]
filterwarnings = [
    # tqdm's own progress-bar formatting uses the Python-3.12-deprecated
    # datetime.utcfromtimestamp(); tracked upstream as fixed in
    # https://github.com/tqdm/tqdm/issues/1517, but still present in some
    # installed versions. Scoped to tqdm.std so it never masks a
    # DeprecationWarning raised by our own code.
    "ignore:datetime\\.datetime\\.utcfromtimestamp\\(\\) is deprecated:DeprecationWarning:tqdm\\.std",
]
